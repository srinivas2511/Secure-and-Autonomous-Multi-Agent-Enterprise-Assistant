worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hide server version
    server_tokens off;

    # Limit request body to 1MB to prevent large-payload abuse
    client_max_body_size 1m;

    # Connection rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    # ── HTTP → HTTPS redirect (uncomment when you have a real cert) ──────────
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl;
        server_name localhost;

        # ssl_certificate     /etc/nginx/certs/server.crt;
        # ssl_certificate_key /etc/nginx/certs/server.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        # API proxy → backend
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://backend:8123;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID      $request_id;

            # SSE: disable buffering so events reach the client in real time
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # Frontend static files (for production build via `npm run build`)
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
